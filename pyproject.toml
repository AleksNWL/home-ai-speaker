[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-ai-speaker"
version = "0.1.0"
description = "Hybrid smart speaker for Rock Pi 4 Plus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "sounddevice>=0.5.0",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17.0",
  "faster-whisper>=1.0.3",
  "google-genai>=1.0.0",
  "python-mpd2>=3.1.0",
  "aiohttp>=3.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
