# Copy to secrets.yaml and fill in. secrets.yaml is gitignored.

gemini:
  api_key: "YOUR_GEMINI_API_KEY"
  # If Gemini returns "User location is not supported":
  # Preferred (no Squid auth): SSH SOCKS from Rock Pi, then:
  #   ssh -N -D 1080 root@YOUR_VPS
  #   proxy: "socks5://127.0.0.1:1080"
  # HTTP Squid (needs working tgproxy user/pass):
  #   proxy: "http://user:pass@127.0.0.1:13128"
  proxy: ""

home_assistant:
  url: "http://127.0.0.1:8123"
  token: "YOUR_LONG_LIVED_ACCESS_TOKEN"
