# Copy to secrets.yaml and fill in. secrets.yaml is gitignored.

gemini:
  api_key: "YOUR_GEMINI_API_KEY"
  # Optional — needed if Gemini returns "User location is not supported"
  # Also can set env: export GEMINI_PROXY="http://user:pass@host:port"
  proxy: ""

home_assistant:
  url: "http://127.0.0.1:8123"
  token: "YOUR_LONG_LIVED_ACCESS_TOKEN"
